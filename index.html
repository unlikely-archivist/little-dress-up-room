<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOLLY</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5eee5;color:#493b3d;font:16px Georgia,serif;min-height:100vh}main{max-width:940px;margin:auto;padding:20px}header{text-align:center}h1{font:900 clamp(48px,10vw,76px)/1.15 Georgia,serif;letter-spacing:.1em;margin:8px 0 18px;color:#e85c9e;background-color:#e85c9e;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.8px),radial-gradient(circle,#ffe0f0 0 1px,transparent 2px),linear-gradient(125deg,#b92068,#ffb6db 35%,#de3b87 55%,#ffd8ec 72%,#c12a72);background-size:7px 9px,11px 7px,100% 100%;background-position:0 0,4px 3px,0 0;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 0 #a93e70) drop-shadow(0 0 5px #f5a4cb)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}header p{color:#826c72;margin:10px}.room{display:flex;align-items:center;justify-content:center;gap:40px}.stage{position:relative;width:min(65vw,440px);aspect-ratio:1090/1443;flex-shrink:0;border-radius:30px}.stage img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}.stage .shirt{width:90%;height:70%;left:5%;top:14.5%}.hair-left{clip-path:polygon(29% 27%,41% 27%,43% 35%,42% 48%,40% 61%,30% 63%,25% 60%,27% 42%)}.hair-right{clip-path:polygon(57% 27%,68% 27%,73% 43%,74% 61%,65% 63%,60% 58%,58% 43%)}aside{width:200px;text-align:center}h2{font-size:18px}.item{position:relative;width:145px;height:145px;overflow:hidden;border:1px dashed #b993a0;border-radius:16px;background:#fffaf5;touch-action:none;cursor:grab;margin:auto;user-select:none}.item img{position:absolute;pointer-events:none;width:165%;height:260%;left:-32.5%;top:-65%;image-rendering:pixelated}.item.empty img{opacity:.17}.item:focus-visible,.remove:focus-visible{outline:3px solid #8c596c}.note{font-size:14px;line-height:1.5;color:#826c72}.hit{position:absolute;left:36%;top:36%;width:28%;height:25%;touch-action:none;cursor:grab}.hit[hidden]{display:none}.hover{background:#ead1da66;outline:2px dashed #b98a9b}.ghost{position:fixed!important;width:130px!important;height:130px!important;z-index:10;pointer-events:none;opacity:.9;transform:translate(-50%,-50%);box-shadow:0 8px 25px #493b3d20}.remove{border:0;background:none;text-decoration:underline;color:#826c72;padding:12px;font:inherit;cursor:pointer}#status{min-height:42px}body.dragging{user-select:none}.dragging .hit,.dragging .item{cursor:grabbing}@media(max-width:600px){main{padding:12px}.room{gap:4px;align-items:center}.stage{width:64vw;max-width:350px}aside{width:28vw}.item{width:100%;height:auto;aspect-ratio:1}h1{font-size:52px}h2{font-size:16px}.note{font-size:13px}.remove{font-size:13px}header p{font-size:14px}}
</style>
<main><header><h1>MOLLY</h1></header><div class="room"><div class="stage" id="doll"><img src="assets/doll-base.png" alt="Blonde doll in a tank top, shorts and socks"><img class="shirt" id="shirt" src="assets/black-shirt.png" alt="" hidden><img class="hair-left" src="assets/doll-base.png" alt=""><img class="hair-right" src="assets/doll-base.png" alt=""><div class="hit" id="worn" role="button" tabindex="0" aria-label="Drag black tee back to wardrobe, or press Enter to remove" hidden></div></div><aside id="wardrobe"><div class="item" id="tee" role="button" tabindex="0" aria-label="Drag black tee onto doll, or press Enter to wear"><img src="assets/black-shirt.png" alt="Black tee" draggable="false"></div><span class="sr-only" id="status" aria-live="polite"></span></aside></div></main>
<script>
const doll=document.getElementById('doll'),tee=document.getElementById('tee'),shirt=document.getElementById('shirt'),worn=document.getElementById('worn'),wardrobe=document.getElementById('wardrobe'),statusText=document.getElementById('status');let equipped=false,drag=null;
function dress(on){equipped=on;shirt.hidden=!on;worn.hidden=!on;tee.classList.toggle('empty',on);statusText.textContent=on?'Drag her shirt back here to take it off.':'Drag the tee onto her.'}
function inside(x,y,element){const r=element.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
function move(e){if(!drag||e.pointerId!==drag.id)return;e.preventDefault();drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';doll.classList.toggle('hover',inside(e.clientX,e.clientY,doll));}
function finish(e,cancel=false){if(!drag||e.pointerId!==drag.id)return;const onDoll=inside(e.clientX,e.clientY,doll),onWardrobe=inside(e.clientX,e.clientY,wardrobe);dress(cancel?drag.before:onDoll?true:onWardrobe?false:drag.before);drag.ghost.remove();drag=null;doll.classList.remove('hover');document.body.classList.remove('dragging')}
function start(e){if(e.button!==0||drag)return;e.preventDefault();const ghost=tee.cloneNode(true);ghost.removeAttribute('id');ghost.removeAttribute('role');ghost.removeAttribute('tabindex');ghost.className='item ghost';ghost.setAttribute('aria-hidden','true');document.body.append(ghost);drag={id:e.pointerId,ghost,before:equipped};e.currentTarget.setPointerCapture(e.pointerId);shirt.hidden=true;document.body.classList.add('dragging');move(e)}
for(const target of [tee,worn]){target.addEventListener('pointerdown',start);target.addEventListener('pointermove',move);target.addEventListener('pointerup',e=>finish(e));target.addEventListener('pointercancel',e=>finish(e,true));target.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();dress(target===tee)}})}
</script></html>

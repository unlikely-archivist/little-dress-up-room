<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOLLY</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ed8d9e url("assets/pink-room.jpg") center center / cover fixed no-repeat;color:#493b3d;font:16px Georgia,serif;min-height:100vh}main{max-width:940px;margin:auto;padding:20px}header{text-align:center}h1{font:900 clamp(48px,10vw,76px)/1.15 Georgia,serif;letter-spacing:.1em;margin:8px 0 18px;color:#e85c9e;background-color:#e85c9e;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.8px),radial-gradient(circle,#ffe0f0 0 1px,transparent 2px),linear-gradient(125deg,#b92068,#ffb6db 35%,#de3b87 55%,#ffd8ec 72%,#c12a72);background-size:7px 9px,11px 7px,100% 100%;background-position:0 0,4px 3px,0 0;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 0 #a93e70) drop-shadow(0 0 5px #f5a4cb)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.board{position:relative;width:100%;max-width:760px;aspect-ratio:1.15;margin:20px auto 0;isolation:isolate;user-select:none}.stage{position:absolute;left:0;top:0;width:60%;aspect-ratio:1090/1443;pointer-events:none}.stage img{position:absolute;width:100%;height:100%;inset:0;image-rendering:pixelated}.base{z-index:0}.front{z-index:2}.hair-left{clip-path:polygon(34% 25%,41% 25%,42% 28%,41% 35%,40% 40%,38.5% 47%,38% 52%,36% 59%,35% 62%,30% 62%,28% 59%,29.5% 52%,31% 45%,32.5% 38%,33.5% 30%)}.hair-right{clip-path:polygon(59% 25%,67% 25%,68.5% 30%,69.5% 38%,71% 45%,72% 52%,73% 60%,67% 62%,65% 59%,64% 52%,63% 47%,61.5% 40%,60% 35%,59% 28%)}.clothing{position:absolute;z-index:1;cursor:grab;touch-action:none;outline:none}.fabric{position:absolute;inset:0;overflow:hidden;pointer-events:none}.fabric img{position:absolute;image-rendering:pixelated;pointer-events:none}.hat{width:30%;height:15.75%;left:62%;top:2%;z-index:3}.hat img{width:307%;height:256%;left:-3%;top:-88.3%}.boots{width:28%;height:28%;left:72%;top:58%;z-index:3}.boots img{width:132.9%;height:151.5%;left:-15%;top:-25.4%}.jacket{width:48%;height:36.7%;left:53%;top:24%}.jacket .fabric{clip-path:polygon(0 0,42% 0,42% 24%,58% 24%,58% 0,100% 0,100% 100%,0 100%)}.jacket img{width:269.5%;height:144.4%;left:-168.4%;top:-18.8%}.clothing:focus-visible{outline:2px dashed #b45e8c;outline-offset:5px}.clothing.dragging{cursor:grabbing}body.dragging{user-select:none}@media(max-width:600px){main{padding:12px 6px}h1{font-size:52px}.board{aspect-ratio:.53}.stage{width:80%;left:10%}.hat{width:40%;height:9.9%;left:41%;top:59%}.boots{width:37.3%;height:15.4%;left:3%;top:77%}.jacket{width:64%;height:23.8%;left:36%;top:75%}}
</style>
<main><header><h1>MOLLY</h1></header><div class="board" id="board"><div class="stage base"><img src="assets/doll-base.png" alt="Molly"></div><div class="clothing jacket" role="button" tabindex="0" aria-label="Movable camouflage jacket"><div class="fabric"><img src="assets/accessories-v2.png" alt="" draggable="false"></div></div><div class="stage front" aria-hidden="true"><img class="hair-left" src="assets/doll-base.png" alt=""><img class="hair-right" src="assets/doll-base.png" alt=""></div><div class="clothing hat" role="button" tabindex="0" aria-label="Movable pink cowboy hat"><div class="fabric"><img src="assets/accessories-v2.png" alt="" draggable="false"></div></div><div class="clothing boots" role="button" tabindex="0" aria-label="Movable black buckle boots"><div class="fabric"><img src="assets/boots-wide.png" alt="" draggable="false"></div></div></div></main>
<script>
const board=document.getElementById('board');
for(const item of document.querySelectorAll('.clothing')){let drag=null;
function place(x,y){item.style.left=x+'%';item.style.top=y+'%'}
item.addEventListener('pointerdown',e=>{if(e.button!==0||drag)return;e.preventDefault();const rect=item.getBoundingClientRect();drag={id:e.pointerId,offsetX:e.clientX-rect.left,offsetY:e.clientY-rect.top,before:{left:item.style.left,top:item.style.top}};item.setPointerCapture(e.pointerId);item.classList.add('dragging');document.body.classList.add('dragging')});
item.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;e.preventDefault();const rect=board.getBoundingClientRect();place((e.clientX-rect.left-drag.offsetX)/rect.width*100,(e.clientY-rect.top-drag.offsetY)/rect.height*100)});
function release(e,cancel){if(!drag||drag.id!==e.pointerId)return;if(cancel){item.style.left=drag.before.left;item.style.top=drag.before.top}drag=null;item.classList.remove('dragging');document.body.classList.remove('dragging')}
item.addEventListener('pointerup',e=>release(e,false));item.addEventListener('pointercancel',e=>release(e,true));item.addEventListener('lostpointercapture',e=>release(e,false));
item.addEventListener('keydown',e=>{const moves={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(!moves[e.key])return;e.preventDefault();const r=item.getBoundingClientRect(),b=board.getBoundingClientRect(),step=e.shiftKey?3:.5;place((r.left-b.left)/b.width*100+moves[e.key][0]*step,(r.top-b.top)/b.height*100+moves[e.key][1]*step)})}
</script></html>

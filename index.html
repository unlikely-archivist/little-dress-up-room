<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOLLY</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5eee5;color:#493b3d;font:16px Georgia,serif;min-height:100vh}main{max-width:940px;margin:auto;padding:20px}header{text-align:center}h1{font:900 clamp(48px,10vw,76px)/1.15 Georgia,serif;letter-spacing:.1em;margin:8px 0 18px;color:#e85c9e;background-color:#e85c9e;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.8px),radial-gradient(circle,#ffe0f0 0 1px,transparent 2px),linear-gradient(125deg,#b92068,#ffb6db 35%,#de3b87 55%,#ffd8ec 72%,#c12a72);background-size:7px 9px,11px 7px,100% 100%;background-position:0 0,4px 3px,0 0;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 0 #a93e70) drop-shadow(0 0 5px #f5a4cb)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.board{position:relative;width:100%;max-width:760px;aspect-ratio:1.15;margin:auto;isolation:isolate;user-select:none}.stage{position:absolute;left:0;top:0;width:60%;aspect-ratio:1090/1443;pointer-events:none}.stage img{position:absolute;width:100%;height:100%;inset:0;image-rendering:pixelated}.base{z-index:0}.front{z-index:2}.hair-left{clip-path:polygon(34% 23%,42% 26%,43% 35%,42% 48%,40% 61%,31% 63%,27% 60%,28% 45%,30% 34%)}.hair-right{clip-path:polygon(58% 23%,66% 25%,68% 34%,72% 45%,73% 60%,65% 63%,60% 58%,58% 43%)}.clothing{position:absolute;width:35.4%;height:26.5%;left:63%;top:26%;z-index:1;cursor:grab;touch-action:none;outline:none}.fabric{position:absolute;inset:0;overflow:hidden;pointer-events:none}.fabric img{position:absolute;width:161.3%;height:243.9%;left:-30.65%;top:-68.29%;image-rendering:pixelated;pointer-events:none}.clothing:focus-visible{outline:2px dashed #b45e8c;outline-offset:5px}.clothing.dragging{cursor:grabbing}body.dragging{user-select:none}@media(max-width:600px){main{padding:12px 6px}h1{font-size:52px}.board{aspect-ratio:.65}.stage{width:80%;left:10%}.clothing{width:47.2%;height:20%;left:49%;top:75%}}
</style>
<main><header><h1>MOLLY</h1></header><div class="board" id="board"><div class="stage base"><img src="assets/doll-base.png" alt="Molly"></div><div class="clothing" id="tee" role="button" tabindex="0" aria-label="Movable black shirt. Drag to place, or use arrow keys to move."><div class="fabric"><img src="assets/black-shirt.png" alt="" draggable="false"></div></div><div class="stage front" aria-hidden="true"><img class="hair-left" src="assets/doll-base.png" alt=""><img class="hair-right" src="assets/doll-base.png" alt=""></div></div></main>
<script>
const board=document.getElementById('board'),tee=document.getElementById('tee');let position=matchMedia('(max-width:600px)').matches?{x:49,y:75}:{x:63,y:26},drag=null;
function render(){tee.style.left=position.x+'%';tee.style.top=position.y+'%'}
tee.addEventListener('pointerdown',e=>{if(e.button!==0||drag)return;e.preventDefault();const rect=tee.getBoundingClientRect();drag={id:e.pointerId,offsetX:e.clientX-rect.left,offsetY:e.clientY-rect.top,before:{...position}};tee.setPointerCapture(e.pointerId);tee.classList.add('dragging');document.body.classList.add('dragging')});
tee.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;e.preventDefault();const rect=board.getBoundingClientRect();position={x:(e.clientX-rect.left-drag.offsetX)/rect.width*100,y:(e.clientY-rect.top-drag.offsetY)/rect.height*100};render()});
function release(e,cancel){if(!drag||drag.id!==e.pointerId)return;if(cancel){position=drag.before;render()}drag=null;tee.classList.remove('dragging');document.body.classList.remove('dragging')}
tee.addEventListener('pointerup',e=>release(e,false));tee.addEventListener('pointercancel',e=>release(e,true));tee.addEventListener('lostpointercapture',e=>release(e,false));
tee.addEventListener('keydown',e=>{const moves={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(!moves[e.key])return;e.preventDefault();const step=e.shiftKey?3:.5;position.x+=moves[e.key][0]*step;position.y+=moves[e.key][1]*step;render()});
</script></html>

<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little dress-up room</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5eee5;color:#493b3d;font:16px Georgia,serif;min-height:100vh}main{max-width:940px;margin:auto;padding:28px 20px}header{text-align:center}h1{font-size:26px;margin:8px}header p{color:#826c72;margin:10px}.room{display:flex;align-items:center;justify-content:center;gap:40px}.stage{position:relative;width:min(65vw,440px);aspect-ratio:1090/1443;flex-shrink:0}.stage img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}.stage .shirt{width:90%;height:70%;left:5%;top:14.5%}.hair-left{clip-path:polygon(29% 27%,41% 27%,43% 35%,42% 48%,40% 61%,30% 63%,25% 60%,27% 42%)}.hair-right{clip-path:polygon(57% 27%,68% 27%,73% 43%,74% 61%,65% 63%,60% 58%,58% 43%)}aside{width:200px}h2{font-size:18px}button{display:block;width:100%;padding:15px;margin:12px 0;border:1px solid #bd9ca6;border-radius:8px;background:#fffaf5;color:inherit;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#ead1da;border:2px solid #8c596c}.note{font-size:13px;line-height:1.5;color:#826c72}@media(max-width:600px){main{padding:14px}.room{gap:4px;flex-direction:column}.stage{width:min(80vw,360px)}aside{width:100%;text-align:center}button{display:inline-block;width:44%;margin:5px}h2{margin:4px}.note{margin:8px}}
</style>
<main><header><h1>Little dress-up room</h1><p>A first outfit to try on ♡</p></header><div class="room"><div class="stage"><img src="assets/doll-base.png" alt="Blonde doll in shorts and socks"><img class="shirt" id="shirt" src="assets/black-shirt.png" alt=""><img class="hair-left" src="assets/doll-base.png" alt=""><img class="hair-right" src="assets/doll-base.png" alt=""></div><aside><h2>Her wardrobe</h2><button aria-pressed="false" onclick="dress(false,this)">Tank top</button><button aria-pressed="true" onclick="dress(true,this)">Black tee</button><p class="note">Try switching tops.<br>Her front hair stays over the shirt.</p></aside></div></main><script>function dress(on,button){document.getElementById('shirt').hidden=!on;document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===button))}</script></html>
